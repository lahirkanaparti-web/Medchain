services:
  # Python FastAPI Backend Service
  - type: web
    name: medchain-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: RPC_URL
        sync: false
      - key: CONTRACT_ADDRESS
        sync: false
      - key: DEPLOYER_PRIVATE_KEY
        sync: false
      - key: PINATA_API_KEY
        sync: false
      - key: PINATA_SECRET
        sync: false
      - key: PINATA_JWT
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ML_MODEL_PATH
        value: app/models/medchain_siamese_embedding.tflite
      - key: ML_BUNDLE_PATH
        value: app/models/medchain_siamese_bundle.joblib

  # React Vite Frontend Static Site
  - type: web
    name: medchain-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: medchain-backend
          property: host
